[tool.ruff]
target-version = "py312"
extend-exclude = [
    ".validation-packages",
    ".safety",
    "backups",
    "exports",
    "uploads",
    "logs",
    ".tmp",
    "tmp",
    "temp",
    "*.db",
    "*.db-*",
    "*.sqlite*",
    "life-ledger-export-*.zip",
]

[tool.ruff.lint]
select = ["E9", "F"]
